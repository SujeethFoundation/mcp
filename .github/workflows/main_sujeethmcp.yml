# Save as .github/workflows/main_sujeethmcp.yml in the mcp repo (replace the file Azure generated).
# The login secrets and app name are the ones Azure's Deployment Center already created for this repo.
#
# What changed from the generated version: the generated one ran "source venv/bin/activate" in one step and
# "pip install" in the next, so the libraries were installed on the build machine and never reached the package.
# This version installs them into .python_packages/lib/site-packages (the folder Azure Functions reads),
# proves the server starts from that folder, checks the zip, and only then deploys. It is the same pattern the
# websearch workflow uses.

name: Build and deploy Python project to Azure Function App - sujeethmcp

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Must match the Python version of the Function App, because compiled packages are built here.
  PYTHON_VERSION: '3.13'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies into deployment package
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --target=".python_packages/lib/site-packages" \
            -r requirements.txt

      - name: Smoke test (the server starts from the packaged libraries and answers)
        run: |
          export PYTHONPATH=".python_packages/lib/site-packages:$PYTHONPATH"
          python -m compileall -q mcp_server.py
          MCP_PORT=8000 python mcp_server.py > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/healthz
          curl -sf -X POST http://127.0.0.1:8000/mcp \
            -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' | grep -q search_sujeeth_foundation
          kill $SERVER_PID || true
          rm -f server.log

      - name: Create deployment package
        run: |
          zip -r release.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "venv/*" \
            -x ".venv/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "local.settings.json" \
            -x "release.zip" \
            -x ".env*"

      - name: Verify deployment package
        run: |
          unzip -t release.zip > /dev/null
          unzip -l release.zip | grep -q " host.json"
          unzip -l release.zip | grep -q " mcp_server.py"
          unzip -l release.zip | grep -q ".python_packages/lib/site-packages/mcp/"
          unzip -l release.zip | grep -q ".python_packages/lib/site-packages/requests/"
          echo "Deployment package verified."

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E3FD04EE7BDF4677A891F325B366890F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_094F21A197614F70A5E49EA79B0D18C1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1BE3C8D42C9244F98703B23895E9C4BC }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: sujeethmcp
          slot-name: Production
          package: release.zip